name: Build DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MIHOMO_VERSION: v1.19.29

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Download mihomo core (darwin-arm64)
        run: |
          set -euo pipefail
          CORE_DIR="$HOME/Library/Application Support/clashbar/core"
          mkdir -p "$CORE_DIR"
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-darwin-arm64-${MIHOMO_VERSION}.gz"
          echo "Downloading $URL"
          curl -fL --retry 3 -o /tmp/mihomo.gz "$URL"
          gunzip -c /tmp/mihomo.gz > "$CORE_DIR/mihomo"
          chmod 0755 "$CORE_DIR/mihomo"
          "$CORE_DIR/mihomo" -v | head -1

      - name: Build & package (self-contained DMG)
        run: |
          chmod +x Scripts/package.sh
          BUNDLE_CORE=1 Scripts/package.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: Clash-Swift-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
